[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vanga"
version = "0.2.0"
description = "GPU tree training with incremental Dataset sources and native Vanga export"
readme = "README.rst"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.2,<3",
  "pytorch-tabular==1.2.0",
  "catboost>=1.2.8,<2",
  "numpy>=1.24,<3",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "requests>=2.31",
]

[project.scripts]
vanga-train = "vanga.utils.NodeTrainer.train:main"
vanga-adaptive-train = "vanga.utils.NodeTrainer.adaptive_train:main"
vanga-search = "vanga.utils.NodeTrainer.search:main"

[tool.setuptools]
packages = ["vanga", "vanga.utils", "vanga.utils.NodeTrainer"]
include-package-data = false
